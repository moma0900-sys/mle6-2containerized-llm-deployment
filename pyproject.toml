[project]
name = "mle-containerized-llm-deployment"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "langchain-google-genai>=4.4.2",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "langchain-groq>=1.1.3",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.7.3",
    "langchain-openrouter>=0.2.9",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "rumdl>=0.3.0",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.rumdl]
disable = ["MD013"]

[tool.rumdl.MD033]
allowed-elements = ["details", "summary"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
