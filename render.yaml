services:
  - type: web
    name: mle-containerized-llm-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8000"
      - key: MODEL_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_CONCURRENT_REQUESTS
        value: "4"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
